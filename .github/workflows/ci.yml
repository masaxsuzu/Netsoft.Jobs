name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同じ PR に対する古い実行は打ち切る。CI の結果待ちが自動マージの前提なので、
# 追い越しが起きると古い成功で誤ってマージされうる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # E2E が使う Chromium。リビジョンは Microsoft.Playwright の版に紐づくので、
      # キャッシュのキーに E2E.csproj のハッシュを含め、版が変わったら取り直す。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/E2E/E2E.csproj') }}

      - name: Install Playwright browser
        run: pwsh tests/E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # カバレッジ計測込みでテストを実行し、行 95% / ブランチ 80% を下回ったら失敗する。
      # 手元でも scripts/coverage.sh で同じ判定を再現できる。
      - name: Test with coverage gate
        run: bash scripts/coverage.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 整形ずれを人間のレビュー対象にしない。指摘がここで自動的に出るようにする。
      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
