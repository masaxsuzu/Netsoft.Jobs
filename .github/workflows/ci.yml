name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同じ PR に対する古い実行は打ち切る。CI の結果待ちが自動マージの前提なので、
# 追い越しが起きると古い成功で誤ってマージされうる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # E2E が使う Chromium。リビジョンは Microsoft.Playwright の版に紐づくので、
      # キャッシュのキーに E2E.csproj のハッシュを含め、版が変わったら取り直す。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/E2E/E2E.csproj') }}
          # 版が変わらない csproj の変更でキャッシュを丸ごと捨てないための保険。
          # 旧キャッシュが復元されても playwright install が差分だけ取り直す。
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: pwsh tests/E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # カバレッジ計測込みで実行する。基準を下回ると coverlet がビルドを失敗させる。
      # 基準と除外は tests/Directory.Build.props と tests/Web/Web.csproj にある。
      #
      # -m:1 でテストプロジェクトを直列に走らせる。判定を持つ tests/Web が最後に
      # 走ることが基準判定の前提だが、並列だと「先に終わった順」でマージされるため、
      # どれかのテストが遅くなるだけで順序が入れ替わって判定が不完全なデータに当たる
      # (実際に起きた)。直列なら .slnx の並び順で決まるので、実行時間に左右されない。
      - name: Test
        run: dotnet test --no-build --configuration Release -m:1 -p:CollectCoverage=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # dotnet format は既定で restore を走らせる。build ジョブと同じキャッシュを
      # 使わないと、CI が動くたびに全パッケージをコールドで取り直すことになる。
      # キーを揃えてあるので、先に走ったジョブが温めたものをそのまま使える。
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # 整形ずれを人間のレビュー対象にしない。指摘がここで自動的に出るようにする。
      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
